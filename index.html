    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
      }

      .container {
        display: flex;
        height: 100vh;
      }

      .sidebar {
        width: 30%;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        background-color: #fff;
        border-right: 1px solid #ddd;
      }

      .search-container {
        padding: 10px 20px;
        border-bottom: 1px solid #ccc;
      }

      #search-input {
        width: 100%;
        padding: 10px;
        font-size: 1em;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      .location-list {
        flex-grow: 1;
        overflow-y: auto;
        padding: 20px;
      }

      .map {
        flex-grow: 1;
      }

      .location {
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 1px solid #ccc;
      }

      .location.active {
        border: 2px solid #1967d2;
        padding: 8px;
        border-radius: 5px;
      }

      .location h3 {
        margin: 0;
        font-size: 1.1em;
      }

      .location p {
        margin: 5px 0;
        font-size: 0.9em;
      }

      .location button {
        margin-top: 5px;
        padding: 6px 12px;
        border: none;
        background-color: #d32f2f;
        color: #fff;
        cursor: pointer;
        border-radius: 4px;
        font-weight: bold;
      }

      .location button:hover {
        background-color: #c62828;
      }

      #search-input {
        width: 100%;
        padding: 10px;
        font-size: 1em;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
    </style>
  </head>

        {

          address: "2701 Pearland Parkway, Ste 160, Pearland, TX 77581 USA",
          phone: "(346) 645-7742",
          url: "https://7spicecajun.com/pearland-parkway/",
          coords: { lat: 29.5578593, lng: -95.2602411 },
        },
        {
          title: "7Spice Missouri City",
          address: "2240 Texas Parkway, Missouri City, TX 77489, USA",
          phone: "(281) 499-7742",
          url: "https://7spicecajun.com/missouri-city/",
          coords: { lat: 29.5949023, lng: -95.527323 },
        },
        {
          title: "7Spice Pasadena",
          address: "3421- B Spencer Hwy, Pasadena, TX 77504, USA",
          phone: "(346) 509-7742",
          url: "https://7spicecajun.com/pasadena/",
          coords: { lat: 29.6656577, lng: -95.2086568 },
        },
      ];

      let map;
      let markers = [];
      let activeMarker = null;
      let activeDiv = null;

      function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 29.717, lng: -95.461 },
          zoom: 11,
        });

        const listContainer = document.getElementById("location-list");
        const bounds = new google.maps.LatLngBounds();

        locations.forEach((loc, index) => {
          const marker = new google.maps.Marker({
            position: loc.coords,
            map,
            title: loc.title,
            icon: getDefaultIcon(),
          });

          markers.push(marker);
          bounds.extend(marker.getPosition());

          const locationDiv = document.createElement("div");
          locationDiv.className = "location";
          locationDiv.innerHTML = `
            <h3>${loc.title}</h3>
            <p>${loc.address}</p>
            <p>${loc.phone}</p>
            <button onclick="top.location.href='${loc.url}'">View Details</button>
          `;

          const handleLocationSelect = () => {
            if (activeMarker) activeMarker.setIcon(getDefaultIcon());

            marker.setIcon(getActiveIcon());
            marker.setAnimation(google.maps.Animation.BOUNCE);
            setTimeout(() => marker.setAnimation(null), 700);
            activeMarker = marker;

            if (activeDiv) activeDiv.classList.remove("active");
            locationDiv.classList.add("active");
            activeDiv = locationDiv;

            map.panTo(marker.getPosition());
            locationDiv.scrollIntoView({ behavior: "smooth", block: "nearest" });
          };

          locationDiv.addEventListener("click", handleLocationSelect);
          marker.addListener("click", handleLocationSelect);

          listContainer.appendChild(locationDiv);
        });

        map.fitBounds(bounds);

        const input = document.getElementById("search-input");
        const autocomplete = new google.maps.places.Autocomplete(input);
        autocomplete.bindTo("bounds", map);

        autocomplete.addListener("place_changed", () => {
          const place = autocomplete.getPlace();
          if (!place.geometry) return;

          const location = place.geometry.location;

          if (place.geometry.viewport) {
            map.fitBounds(place.geometry.viewport);
          } else {
            map.setCenter(location);
            map.setZoom(12);
          }

          const exactMatch = locations.some(
            (loc) => loc.coords.lat === location.lat() && loc.coords.lng === location.lng()
          );

          if (!exactMatch) {
            // Find the nearest known location
            let nearest = null;
            let minDistance = Infinity;

            locations.forEach((loc, index) => {
              const dist = google.maps.geometry.spherical.computeDistanceBetween(
                new google.maps.LatLng(loc.coords.lat, loc.coords.lng),
                location
              );
              if (dist < minDistance) {
                minDistance = dist;
                nearest = { loc, index };
              }
            });

            if (nearest) {
              const marker = markers[nearest.index];
              const locationDiv = document.getElementsByClassName("location")[nearest.index];

              // Highlight and animate the marker and list item
              if (activeMarker) activeMarker.setIcon(getDefaultIcon());
              marker.setIcon(getActiveIcon());
              marker.setAnimation(google.maps.Animation.BOUNCE);
              setTimeout(() => marker.setAnimation(null), 700);
              activeMarker = marker;

              if (activeDiv) activeDiv.classList.remove("active");
              locationDiv.classList.add("active");
              activeDiv = locationDiv;

              map.panTo(marker.getPosition());
              locationDiv.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
          }
        });
        
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();

            // Check if autocomplete dropdown is visible
            const pacContainer = document.querySelector(".pac-container");
            const isDropdownVisible = pacContainer && pacContainer.style.display !== "none";

            if (isDropdownVisible) {
              // The autocomplete dropdown is visible, but user pressed Enter without clicking
              // Trigger place_changed manually to force selection of first item
              google.maps.event.trigger(input, "keydown", {
                keyCode: 40, // DOWN arrow key to highlight first option
              });

              setTimeout(() => {
                google.maps.event.trigger(input, "keydown", {
                  keyCode: 13, // ENTER key to select highlighted option
                });
              }, 100);
            } else {
              // No dropdown, you could either ignore or manually handle it (e.g., select nearest location)
              // Or just do nothing
            }
          }
        });
      }

      function getDefaultIcon() {
        return {
          url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png",
        };
      }

      function getActiveIcon() {
        return {
          url: "https://maps.google.com/mapfiles/ms/icons/yellow-dot.png",
        };
      }
    </script>

      async
      defer
    ></script>
