<!DOCTYPE html>
<html>
  <head>
    <title>7Spice Store Locator</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: Arial, sans-serif;
        display: flex;
      }
      .sidebar {
        width: 30%;
        max-width: 400px;
        overflow-y: auto;
        background: #f7f7f7;
        padding: 1rem;
        box-shadow: 2px 0 5px rgba(0,0,0,0.1);
      }
      .location {
        margin-bottom: 1.5rem;
        border-bottom: 1px solid #ddd;
        padding-bottom: 1rem;
      }
      .location h3 {
        margin: 0 0 0.5rem;
      }
      .location button {
        background: #1967d2;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        cursor: pointer;
        border-radius: 5px;
      }
      gmp-map {
        flex-grow: 1;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="sidebar" id="locationList"></div>

    <gmp-map center="29.7,-95.4" zoom="10" map-id="DEMO_MAP_ID"></gmp-map>

    <script>
      const locations = [
        {
          title: "7Spice Galleria",
          address: "6449 Westheimer Rd, Houston, TX 77057",
          coords: { lat: 29.737322, lng: -95.498383 },
          link: "https://7spicecajun.com/houston-galleria/"
        },
        {
          title: "7Spice Medical Center",
          address: "9540 S Main St STE 140, Houston, TX 77025",
          coords: { lat: 29.681298, lng: -95.425530 },
          link: "https://7spicecajun.com/medical-center/"
        }
      ];

      const markerRefs = [];
      const locationList = document.getElementById("locationList");
      const map = document.querySelector("gmp-map");

      customElements.whenDefined("gmp-map").then(() => {
        locations.forEach((loc, index) => {
          const marker = document.createElement("gmp-advanced-marker");
          marker.setAttribute("position", `${loc.coords.lat},${loc.coords.lng}`);
          marker.setAttribute("title", loc.title);
          marker.innerHTML = `<img src="https://maps.google.com/mapfiles/ms/icons/red-dot.png">`;
          map.appendChild(marker);
          markerRefs.push(marker);

          const item = document.createElement("div");
          item.className = "location";
          item.innerHTML = `
            <h3>${loc.title}</h3>
            <p>${loc.address}</p>
            <button onclick="window.location='${loc.link}'">View Details</button>
          `;
          item.addEventListener("click", () => {
            map.setAttribute("center", `${loc.coords.lat},${loc.coords.lng}`);
            markerRefs.forEach(m => m.innerHTML = `<img src='https://maps.google.com/mapfiles/ms/icons/red-dot.png'>`);
            marker.innerHTML = `<img src='https://maps.google.com/mapfiles/ms/icons/blue-dot.png'>`;
          });

          locationList.appendChild(item);
        });
      });
    </script>

    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCY_FY1Uf8i2QBA2rlkyH0_aU7bY4cQro8&libraries=marker&v=beta"
      defer
    ></script>
  </body>
</html>
