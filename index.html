<!DOCTYPE html>
<html>
  <head>
    <title>7Spice Locations</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
      }

      .container {
        display: flex;
        height: 100vh;
      }

      .sidebar {
        width: 30%;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
        background-color: #fff;
        border-right: 1px solid #ddd;
      }

      .map {
        flex-grow: 1;
      }

      .location {
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 1px solid #ccc;
      }

      .location.active {
        border: 2px solid #1967d2;
        padding: 8px;
        border-radius: 5px;
      }

      .location h3 {
        margin: 0;
        font-size: 1.1em;
      }

      .location p {
        margin: 5px 0;
        font-size: 0.9em;
      }

      .location button {
        margin-top: 5px;
        padding: 6px 12px;
        border: none;
        background-color: #d32f2f;
        color: #fff;
        cursor: pointer;
        border-radius: 4px;
        font-weight: bold;
      }

      .location button:hover {
        background-color: #c62828;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="sidebar" id="location-list"></div>
      <div class="map" id="map"></div>
    </div>

    <script>
      const locations = [
        {
          title: "7Spice Galleria",
          address: "6449 Westheimer Rd, Houston, TX 77057, USA",
          phone: "(713) 780-7773",
          url: "https://7spicecajun.com/houston-galleria/",
          coords: { lat: 29.737322, lng: -95.498383 },
        },
        {
          title: "7Spice Medical Center",
          address: "9540 S Main St STE 140, Houston, TX 77025, USA",
          phone: "(713) 123-4567",
          url: "https://7spicecajun.com/medical-center/",
          coords: { lat: 29.681298, lng: -95.42553 },
        },
      ];

      let map;
      let markers = [];
      let activeMarker = null;
      let activeDiv = null;

      function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 29.717, lng: -95.461 },
          zoom: 11,
        });

        const listContainer = document.getElementById("location-list");

        locations.forEach((loc, index) => {
          const marker = new google.maps.Marker({
            position: loc.coords,
            map,
            title: loc.title,
            icon: getDefaultIcon(),
          });

          markers.push(marker);

          const locationDiv = document.createElement("div");
          locationDiv.className = "location";
          locationDiv.innerHTML = `
            <h3>${loc.title}</h3>
            <p>${loc.address}</p>
            <p>${loc.phone}</p>
            <button onclick="window.location.href='${loc.url}'">View Details</button>
          `;

          locationDiv.addEventListener("click", () => {
            if (activeMarker) activeMarker.setIcon(getDefaultIcon());
            marker.setIcon(getActiveIcon());
            activeMarker = marker;

            if (activeDiv) activeDiv.classList.remove("active");
            locationDiv.classList.add("active");
            activeDiv = locationDiv;

            map.panTo(marker.getPosition());
          });

          listContainer.appendChild(locationDiv);
        });
      }

      function getDefaultIcon() {
        return {
          url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png",
        };
      }

      function getActiveIcon() {
        return {
          url: "https://maps.google.com/mapfiles/ms/icons/yellow-dot.png",
        };
      }
    </script>
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCY_FY1Uf8i2QBA2rlkyH0_aU7bY4cQro8&callback=initMap"
      async
      defer
    ></script>
  </body>
</html>
