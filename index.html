<!DOCTYPE html>
<html>
  <head>
    <title>7Spice Locations</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
      }

      .container {
        display: flex;
        flex-direction: row;
        height: 100vh;
      }

      .sidebar {
        width: 30%;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
        background-color: #fff;
        border-right: 1px solid #ddd;
      }


      .search-container {
        position: relative;
        margin-bottom: 20px;
      }
      
      #search-input {
        width: 100%;
        padding: 10px 35px 10px 10px;
        font-size: 1em;
        box-sizing: border-box;
      }
      
      #clear-button {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: none;
        font-size: 1.2em;
        cursor: pointer;
        color: #999;
      }

      #clear-button:hover {
        color: #333;
      }

      .location-list {
        flex-grow: 1;
        overflow-y: auto;
        padding: 20px;
      }

      .map {
        flex-grow: 1;
      }

      .location {
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 1px solid #ccc;
      }

      .location.active {
        border: 2px solid #1967d2;
        padding: 8px;
        border-radius: 5px;
      }

      .location h3 {
        margin: 0;
        font-size: 1.1em;
      }

      .location p {
        margin: 5px 0;
        font-size: 0.9em;
      }

      .location button {
        margin-top: 5px;
        padding: 6px 12px;
        border: none;
        background-color: #d32f2f;
        color: #fff;
        cursor: pointer;
        border-radius: 4px;
        font-weight: bold;
      }

      .location button:hover {
        background-color: #c62828;
      }

      @media (max-width: 768px) {
        .container {
          flex-direction: column;
        }

        .map {
          height: 300px; /* Smaller map for mobile */
          order: 0; /* Map on top */
        }

        .sidebar {
          height: 30vh; /* Half screen for list */
          order: 1;
          width: 100%;
          padding: 10px;
        }

        .location {
          margin-bottom: 15px;
          padding-bottom: 8px;
        }

        .search-container {
          margin-bottom: 15px;
        }
      }

      #search-input {
        width: 100%;
        padding: 10px;
        font-size: 1em;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>

          <button id="clear-button" title="Clear Search">×</button>
        </div>
        <div class="location-list" id="location-list"></div>
      </div>
      <div class="map" id="map"></div>

    <script>

        {

          phone: "(281) 412-7742",

        },
        {
          title: "7Spice Fuqua & I-45",
          address: "11013 Fuqua Street, Houston, TX 77089, USA",
          phone: "(713) 943-7742",
          url: "https://7spicecajun.com/south-houston-fuqua-i-45/",
          coords: { lat: 29.6132779, lng: -95.2228953 },
        },
        {
          title: "7Spice Pearland Parkway",
          address: "2701 Pearland Parkway, Ste 160, Pearland, TX 77581, USA",
          phone: "(346) 645-7742",
          url: "https://7spicecajun.com/pearland-parkway/",
          coords: { lat: 29.5580817, lng: -95.3429859 },
        },
        {
          title: "7Spice Atascocita",
          address: "7551 FM 1960 E, Suite 160, Humble, TX 77346, USA",
          phone: "(346) 471-7742",
          url: "https://7spicecajun.com/atascocita/",
          coords: { lat: 30.0005963, lng: -95.1604656 },
        },
      ];

      let map;
      let markers = [];
      let activeMarker = null;
      let activeDiv = null;

      function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 29.717, lng: -95.461 },
          zoom: 11,
        });

        const listContainer = document.getElementById("location-list");
        const bounds = new google.maps.LatLngBounds();

        locations.forEach((loc, index) => {
          const marker = new google.maps.Marker({
            position: loc.coords,
            map,
            title: loc.title,
            icon: getDefaultIcon(),
          });

          markers.push(marker);
          bounds.extend(marker.getPosition());

          const locationDiv = document.createElement("div");
          locationDiv.className = "location";
          locationDiv.innerHTML = `
            <h3>${loc.title}</h3>
            <p>${loc.address}</p>
            <p>${loc.phone}</p>
            <button onclick="top.location.href='${loc.url}'">View Details</button>
          `;

          const handleLocationSelect = (selectedLoc, selectedMarker) => {
            // Reset previous marker icon
            if (activeMarker) activeMarker.setIcon(getDefaultIcon());

            // Set active marker and animate bounce
            selectedMarker.setIcon(getActiveIcon());
            selectedMarker.setAnimation(google.maps.Animation.BOUNCE);
            setTimeout(() => selectedMarker.setAnimation(null), 700);
            activeMarker = selectedMarker;

            // Pan map to selected marker
            map.panTo(selectedMarker.getPosition());

            // Sort locations by distance to selected marker
            const sorted = [...locations].sort((a, b) => {
              const distA = google.maps.geometry.spherical.computeDistanceBetween(
                new google.maps.LatLng(selectedLoc.coords),
                new google.maps.LatLng(a.coords)
              );
              const distB = google.maps.geometry.spherical.computeDistanceBetween(
                new google.maps.LatLng(selectedLoc.coords),
                new google.maps.LatLng(b.coords)
              );
              return distA - distB;
            });

            // Rebuild sidebar
            const listContainer = document.getElementById("location-list");
            listContainer.innerHTML = "";

            sorted.forEach(loc => {
              const marker = markers.find(m => m.getTitle() === loc.title); // reuse existing markers

              const locationDiv = document.createElement("div");
              locationDiv.className = "location";
              locationDiv.innerHTML = `
                <h3>${loc.title}</h3>
                <p>${loc.address}</p>
                <p>${loc.phone}</p>
                <button onclick="top.location.href='${loc.url}'">View Details</button>
              `;

              if (loc.title === selectedLoc.title) {
                locationDiv.classList.add("active");
                activeDiv = locationDiv;
                setTimeout(() => locationDiv.scrollIntoView({ behavior: "smooth", block: "nearest" }), 300);
              }

              locationDiv.addEventListener("click", () => handleLocationSelect(loc, marker));
              marker.addListener("click", () => handleLocationSelect(loc, marker));

              listContainer.appendChild(locationDiv);
            });

            // Scroll the parent page to the map section
            // Send a message to the parent page
            window.parent.postMessage({ type: 'scrollToTop' }, '*');
          };

          locationDiv.addEventListener("click", () => handleLocationSelect(loc, marker));
          marker.addListener("click", () => handleLocationSelect(loc, marker));

          listContainer.appendChild(locationDiv);
        });

        map.fitBounds(bounds);

        const input = document.getElementById("search-input");
        const autocomplete = new google.maps.places.Autocomplete(input);
        autocomplete.bindTo("bounds", map);

        autocomplete.addListener("place_changed", () => {
          const place = autocomplete.getPlace();
          if (!place.geometry) return;

          const location = place.geometry.location;

          if (place.geometry.viewport) {
            map.fitBounds(place.geometry.viewport);
          } else {
            map.setCenter(location);
            map.setZoom(12);
          }

          // Calculate distances and sort locations
          const sorted = locations
            .map((loc, index) => {
              const dist = google.maps.geometry.spherical.computeDistanceBetween(
                new google.maps.LatLng(loc.coords.lat, loc.coords.lng),
                location
              );
              return { loc, index, dist };
            })
            .sort((a, b) => a.dist - b.dist);

          // Rebuild the sidebar in order of proximity
          const listContainer = document.getElementById("location-list");
          listContainer.innerHTML = "";
          const locationDivs = [];

          sorted.forEach((item, sortedIndex) => {
            const { loc, index } = item;

            const marker = markers[index];
            const locationDiv = document.createElement("div");
            locationDiv.className = "location";
            locationDiv.innerHTML = `
              <h3>${loc.title}</h3>
              <p>${loc.address}</p>
              <p>${loc.phone}</p>
              <button onclick="top.location.href='${loc.url}'">View Details</button>
            `;

            locationDiv.addEventListener("click", () => {
              if (activeMarker) activeMarker.setIcon(getDefaultIcon());
              marker.setIcon(getActiveIcon());
              marker.setAnimation(google.maps.Animation.BOUNCE);
              setTimeout(() => marker.setAnimation(null), 700);
              activeMarker = marker;

              if (activeDiv) activeDiv.classList.remove("active");
              locationDiv.classList.add("active");
              activeDiv = locationDiv;

              map.panTo(marker.getPosition());
              locationDiv.scrollIntoView({ behavior: "smooth", block: "nearest" });

              window.parent.postMessage({ type: 'scrollToTop' }, '*');
            });

            marker.addListener("click", () => {
              locationDiv.click(); // trigger same behavior
            });

            listContainer.appendChild(locationDiv);
            locationDivs.push(locationDiv);
          });

          // Now highlight the closest one
          const closest = sorted[0];
          const closestMarker = markers[closest.index];
          const closestDiv = locationDivs[0];

          if (activeMarker) activeMarker.setIcon(getDefaultIcon());
          closestMarker.setIcon(getActiveIcon());
          closestMarker.setAnimation(google.maps.Animation.BOUNCE);
          setTimeout(() => closestMarker.setAnimation(null), 700);
          activeMarker = closestMarker;

          if (activeDiv) activeDiv.classList.remove("active");
          closestDiv.classList.add("active");
          activeDiv = closestDiv;

          map.panTo(closestMarker.getPosition());
          closestDiv.scrollIntoView({ behavior: "smooth", block: "nearest" });
          window.parent.postMessage({ type: 'scrollToTop' }, '*');
        });

        
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();

            // Check if autocomplete dropdown is visible
            const pacContainer = document.querySelector(".pac-container");
            const isDropdownVisible = pacContainer && pacContainer.style.display !== "none";

            if (isDropdownVisible) {
              // The autocomplete dropdown is visible, but user pressed Enter without clicking
              // Trigger place_changed manually to force selection of first item
              google.maps.event.trigger(input, "keydown", {
                keyCode: 40, // DOWN arrow key to highlight first option
              });

              setTimeout(() => {
                google.maps.event.trigger(input, "keydown", {
                  keyCode: 13, // ENTER key to select highlighted option
                });
              }, 100);
            } else {
              // No dropdown, you could either ignore or manually handle it (e.g., select nearest location)
              // Or just do nothing
            }
          }
        });
      }

      // search bar clear functionality
      const input = document.getElementById("search-input");
      const clearBtn = document.getElementById("clear-button");

      clearBtn.addEventListener("click", () => {
        input.value = "";
        input.focus();
      });

      function getDefaultIcon() {
        return {
          url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png",
        };
      }

      function getActiveIcon() {
        return {
          url: "https://maps.google.com/mapfiles/ms/icons/yellow-dot.png",
        };
      }

    </script>
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCY_FY1Uf8i2QBA2rlkyH0_aU7bY4cQro8&libraries=places,geometry&callback=initMap"
      async
      defer
